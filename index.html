<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to Neon City</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="city">

    <!-- Sky -->
    <div class="sky"></div>
    <div class="moon"></div>

    <!-- Buildings -->
    <div class="buildings">

        <div class="building building-1">
            <div class="windows"></div>
        </div>

        <div class="building building-2">
            <div class="windows"></div>
        </div>

        <div class="building building-3">
            <div class="windows"></div>
        </div>

        <div class="building building-4">
            <div class="windows"></div>
        </div>

        <div class="building building-5">
            <div class="windows"></div>
        </div>

    </div>

    <!-- Neon Signs -->
    <div class="sign sign-pink">
        TOKYO
    </div>

    <div class="sign sign-blue">
        NEXUS
    </div>

    <div class="sign sign-purple">
        2077
    </div>

    <!-- Girl -->
    <div class="girl">

        <div class="hair"></div>

        <div class="head"></div>

        <div class="neck"></div>

        <div class="body"></div>

        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>

    </div>

    <!-- Car -->
    <div class="car">

        <div class="car-roof"></div>

        <div class="car-window window-left"></div>
        <div class="car-window window-right"></div>

        <div class="car-body">

            <div class="headlight headlight-left"></div>
            <div class="headlight headlight-right"></div>

            <div class="wheel wheel-left"></div>
            <div class="wheel wheel-right"></div>

        </div>

    </div>

    <!-- Road -->
    <div class="road">

        <div class="road-line line-1"></div>
        <div class="road-line line-2"></div>
        <div class="road-line line-3"></div>

    </div>

    <!-- Rain -->
    <div class="rain" id="rain"></div>

    <!-- Fog -->
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>

    <!-- Welcome -->
    <main class="welcome">

        <div class="location">
            ✦ SECTOR 07 • NIGHT DISTRICT ✦
        </div>

        <h1>
            Welcome to
            <span>Neon City</span>
        </h1>

        <p>
            Where the night never ends,
            the streets glow forever,
            and every dream has a digital heartbeat.
        </p>

        <button id="enterButton">
            ENTER THE CITY
            <span>→</span>
        </button>

    </main>

    <div class="city-name">
        NEON CITY
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
